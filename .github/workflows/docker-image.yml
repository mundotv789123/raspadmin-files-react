name: Docker Image CI

on:
  workflow_dispatch:
  push:
    branches: [ "develop" ]
  release:
    types: [ "created" ]

env:
  DOCKER_IMAGE_FILE: Dockerfile
  DOCKER_IMAGE_TAG: mundotv789123/raspadmin
  DOCKER_USERNAME: mundotv789123

  DOCKER_GOLANG_FILE: Dockerfile.golang
  DOCKER_GOLANG_TAG: mundotv789123/raspadmin:go

jobs:
  build-node:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up environment docker tag
        id: set_env
        run: |
          if [[ "${{ github.ref_name }}" == "develop" ]]; then
            echo "DOCKER_IMAGE_FILE=Dockerfile.dev" >> $GITHUB_ENV
            echo "DOCKER_IMAGE_TAG=${{ env.DOCKER_IMAGE_TAG }}:dev" >> $GITHUB_ENV

            echo "DOCKER_GOLANG_FILE=Dockerfile.golang.dev" >> $GITHUB_ENV
            echo "DOCKER_GOLANG_TAG=${{ env.DOCKER_GOLANG_TAG }}_dev" >> $GITHUB_ENV
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: build-node
    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: "${{ secrets.DOCKER_USERNAME }}"
          password: "${{ secrets.DOCKER_TOKEN }}"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          file: "${{ env.DOCKER_IMAGE_FILE }}"
          context: .
          push: true
          tags: "${{ env.DOCKER_IMAGE_TAG }}"
          platforms: linux/amd64,linux/arm64

  docker-build-go:
    runs-on: ubuntu-latest
    needs: build-node
    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: "${{ secrets.DOCKER_USERNAME }}"
          password: "${{ secrets.DOCKER_TOKEN }}"

      - name: Build and push golang
        uses: docker/build-push-action@v5
        with:
          file: "${{ env.DOCKER_GOLANG_FILE }}"
          context: .
          push: true
          tags: "${{ env.DOCKER_GOLANG_TAG }}"
          platforms: linux/amd64,linux/arm64

  deploy-dev:
    needs: 
      - docker-build
      - docker-build-go
    uses: ./.github/workflows/deploy-docker.yml
    if: github.ref == 'refs/heads/develop'
    secrets:
      SERVER_IP: ${{ secrets.SERVER_IP }}
      SERVER_KEY: ${{ secrets.SERVER_KEY }}